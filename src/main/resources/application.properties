quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=socialfolliauser
quarkus.datasource.password=socialfolliapass

quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5434/socialfollia
quarkus.datasource.jdbc.max-size=16

# Swagger
quarkus.swagger-ui.always-include=true

# Flyway para Migration DB
quarkus.flyway.migrate-at-start=true

# Pede ao Hibernate para verificar se as entidades estão configuradas conforme as tabelas
quarkus.hibernate-orm.database.generation=validate