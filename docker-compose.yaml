services:
  db:
    image: postgres:18.2
    environment:
      POSTGRES_DB: socialfollia
      POSTGRES_USER: socialfolliauser
      POSTGRES_PASSWORD: socialfolliapass
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    networks:
      - private-network
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - "15432:80"
    networks:
      - public-network
      - private-network
